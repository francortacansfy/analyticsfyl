<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYnutrition — AOV Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --green: #16a97e;
            --green-dim: rgba(22,169,126,.12);
            --blue: #3b6bff;
            --orange: #f59e0b;
            --red: #ef4444;
            --purple: #8b5cf6;
            --bg: #0a0c10;
            --surface: #111318;
            --surface-2: #1a1d26;
            --border: rgba(255,255,255,.07);
            --border-2: rgba(255,255,255,.12);
            --text-1: #f0f2f7;
            --text-2: #9ba3b8;
            --text-3: #5c6478;
            --radius: 14px;
            --radius-lg: 20px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-1);
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: rgba(10,12,16,.9);
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo-mark {
            width: 34px; height: 34px;
            background: var(--green);
            border-radius: 10px;
            display: grid; place-items: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
        }
        .header-title {
            font-family: 'Syne', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-1);
        }
        .header-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }

        .btn-load {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 20px;
            background: var(--green);
            color: #fff;
            border: none; border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            transition: opacity .2s;
        }
        .btn-load:hover { opacity: .85; }
        .btn-load.loading { opacity: .6; pointer-events: none; }
        .btn-load.loading::before {
            content: '';
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* FILTERS */
        .filters-bar {
            padding: 16px 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .filter-label { font-size: 12px; color: var(--text-3); font-weight: 500; margin-right: 4px; }
        .filter-btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-2);
            background: none;
            color: var(--text-2);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px; font-weight: 500;
            cursor: pointer;
            transition: all .15s;
        }
        .filter-btn:hover { border-color: var(--green); color: var(--green); }
        .filter-btn.active { background: var(--green-dim); border-color: var(--green); color: var(--green); }
        .filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

        /* CONTENT */
        .content { padding: 28px 32px; max-width: 1400px; margin: 0 auto; }

        /* KPI ROW */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
        }
        .kpi-label {
            font-size: 11px; font-weight: 600;
            text-transform: uppercase; letter-spacing: .7px;
            color: var(--text-3);
            margin-bottom: 8px;
        }
        .kpi-value {
            font-family: 'Syne', sans-serif;
            font-size: 28px; font-weight: 700;
            color: var(--text-1);
            letter-spacing: -.5px;
            line-height: 1;
        }
        .kpi-sub { font-size: 11.5px; color: var(--text-3); margin-top: 5px; }
        .kpi-accent { color: var(--green); }

        /* GRID */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; margin-bottom: 18px; }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 24px;
        }
        .card-full { grid-column: 1 / -1; }

        .card-title {
            font-family: 'Syne', sans-serif;
            font-size: 14px; font-weight: 700;
            color: var(--text-1);
            margin-bottom: 4px;
        }
        .card-sub { font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
        .chart-wrap { position: relative; height: 260px; }
        .chart-wrap-sm { position: relative; height: 200px; }

        /* TIENDA CARDS */
        .tienda-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .tienda-card {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            position: relative;
            overflow: hidden;
        }
        .tienda-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
        }
        .tienda-card:nth-child(1)::after { background: var(--green); }
        .tienda-card:nth-child(2)::after { background: var(--blue); }
        .tienda-card:nth-child(3)::after { background: var(--orange); }
        .tienda-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); margin-bottom: 6px; }
        .tienda-aov {
            font-family: 'Syne', sans-serif;
            font-size: 22px; font-weight: 700;
            color: var(--text-1);
        }
        .tienda-meta { font-size: 11px; color: var(--text-3); margin-top: 4px; }

        /* DISTRIBUTION TABLE */
        .dist-row {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .dist-row:last-child { border-bottom: none; }
        .dist-range { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-2); width: 130px; flex-shrink: 0; }
        .dist-bar-wrap { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
        .dist-bar { height: 100%; border-radius: 3px; background: var(--green); transition: width .6s ease; }
        .dist-count { font-size: 12px; color: var(--text-3); width: 60px; text-align: right; flex-shrink: 0; }
        .dist-pct { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--green); width: 44px; text-align: right; flex-shrink: 0; }

        /* EMPTY */
        .empty { padding: 48px; text-align: center; color: var(--text-3); font-size: 13px; }
        .spinner-wrap { display: flex; justify-content: center; align-items: center; padding: 60px; }
        .spinner {
            width: 28px; height: 28px;
            border: 2.5px solid var(--border-2);
            border-top-color: var(--green);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-left">
        <div class="logo-mark">FY</div>
        <div>
            <div class="header-title">AOV Analytics</div>
            <div class="header-sub">Average Order Value · Distribución · Evolución</div>
        </div>
    </div>
    <button class="btn-load" id="loadBtn" onclick="loadData()">Cargar datos</button>
</header>

<div class="filters-bar">
    <span class="filter-label">Período</span>
    <button class="filter-btn active" data-period="all" onclick="setPeriod(this)">Todo</button>
    <button class="filter-btn" data-period="365" onclick="setPeriod(this)">Último año</button>
    <button class="filter-btn" data-period="180" onclick="setPeriod(this)">6 meses</button>
    <button class="filter-btn" data-period="90" onclick="setPeriod(this)">3 meses</button>
    <button class="filter-btn" data-period="30" onclick="setPeriod(this)">30 días</button>
    <div class="filter-sep"></div>
    <span class="filter-label">Tienda</span>
    <button class="filter-btn active" data-tienda="" onclick="setTienda(this)">Todas</button>
    <div id="tiendaBtns"></div>
</div>

<div class="content">
    <div id="mainContent">
        <div class="empty">Hacé click en "Cargar datos" para ver el análisis</div>
    </div>
</div>

<script>
const SUPA_URL = 'https://tilsqawlwgbuttyboxpn.supabase.co';
const SUPA_KEY = 'sb_publishable_14OWO27CxU7Cml4rwtvBlg_8RR-6sGm';

let RAW = [];
let DATA = [];
let CHARTS = {};
let activePeriod = 'all';
let activeTienda = '';

function fmt(n) { return '$' + Math.round(n).toLocaleString('es-AR'); }
function fmtK(n) { return n >= 1000 ? '$' + (n/1000).toFixed(1) + 'k' : fmt(n); }

async function loadData() {
    const btn = document.getElementById('loadBtn');
    btn.classList.add('loading');
    btn.textContent = '';

    try {
        let all = [];
        let from = 0;
        const pageSize = 1000;
        while (true) {
            const res = await fetch(
                `${SUPA_URL}/rest/v1/ventas?select=num_venta,fecha,total_ars,tienda,dni&limit=${pageSize}&offset=${from}`,
                { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
            );
            if (!res.ok) throw new Error(`Error ${res.status}`);
            const page = await res.json();
            all = all.concat(page);
            if (page.length < pageSize) break;
            from += pageSize;
        }

        // Agrupar por num_venta para calcular AOV por orden
        const ordenMap = {};
        all.forEach(r => {
            if (!r.num_venta || !r.total_ars) return;
            if (!ordenMap[r.num_venta]) {
                ordenMap[r.num_venta] = { total: 0, fecha: r.fecha, tienda: r.tienda || '', dni: r.dni || '' };
            }
            ordenMap[r.num_venta].total += parseFloat(r.total_ars) || 0;
        });

        RAW = Object.values(ordenMap).filter(o => o.total > 0);

        // Poblar filtros de tienda
        const tiendas = [...new Set(RAW.map(o => o.tienda).filter(Boolean))].sort();
        document.getElementById('tiendaBtns').innerHTML = tiendas.map(t =>
            `<button class="filter-btn" data-tienda="${t}" onclick="setTienda(this)">${t}</button>`
        ).join('');

        applyFilters();
    } catch(e) {
        console.error(e);
        document.getElementById('mainContent').innerHTML = `<div class="empty">Error al cargar datos: ${e.message}</div>`;
    } finally {
        btn.classList.remove('loading');
        btn.textContent = 'Actualizar';
    }
}

function setPeriod(el) {
    document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    activePeriod = el.dataset.period;
    applyFilters();
}

function setTienda(el) {
    document.querySelectorAll('[data-tienda]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    activeTienda = el.dataset.tienda;
    applyFilters();
}

function applyFilters() {
    let filtered = [...RAW];

    // Filtro período
    if (activePeriod !== 'all') {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - parseInt(activePeriod));
        filtered = filtered.filter(o => o.fecha && new Date(o.fecha) >= cutoff);
    }

    // Filtro tienda
    if (activeTienda) {
        filtered = filtered.filter(o => o.tienda === activeTienda);
    }

    DATA = filtered;
    render();
}

function render() {
    if (!DATA.length) {
        document.getElementById('mainContent').innerHTML = '<div class="empty">Sin datos para el período seleccionado</div>';
        return;
    }

    const totals = DATA.map(o => o.total);
    const totalRevenue = totals.reduce((s, v) => s + v, 0);
    const aov = totalRevenue / totals.length;
    const median = calcMedian(totals);
    const maxOrder = Math.max(...totals);
    const uniqueClients = new Set(DATA.map(o => o.dni).filter(Boolean)).size;

    document.getElementById('mainContent').innerHTML = `
        <div class="kpi-row" id="kpiRow"></div>
        <div class="card" style="margin-bottom:18px;">
            <div class="card-title">AOV por tienda</div>
            <div class="card-sub">Ticket promedio y volumen por canal de venta</div>
            <div class="tienda-grid" id="tiendaCards"></div>
        </div>
        <div class="grid-2">
            <div class="card">
                <div class="card-title">Evolución del AOV</div>
                <div class="card-sub">Ticket promedio mensual en el tiempo</div>
                <div class="chart-wrap"><canvas id="chartEvol"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">Distribución de tickets</div>
                <div class="card-sub">Concentración de órdenes por rango de precio</div>
                <div id="distRows"></div>
            </div>
        </div>
        <div class="grid-2">
            <div class="card">
                <div class="card-title">Órdenes por rango</div>
                <div class="card-sub">Cantidad de órdenes en cada bracket de precio</div>
                <div class="chart-wrap-sm"><canvas id="chartDist"></canvas></div>
            </div>
            <div class="card">
                <div class="card-title">AOV por tienda — comparativa</div>
                <div class="card-sub">Ticket promedio relativo entre canales</div>
                <div class="chart-wrap-sm"><canvas id="chartTienda"></canvas></div>
            </div>
        </div>
    `;

    // KPIs
    document.getElementById('kpiRow').innerHTML = `
        <div class="kpi">
            <div class="kpi-label">AOV General</div>
            <div class="kpi-value kpi-accent">${fmt(aov)}</div>
            <div class="kpi-sub">Ticket promedio por orden</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Mediana</div>
            <div class="kpi-value">${fmt(median)}</div>
            <div class="kpi-sub">50% de órdenes debajo</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Total órdenes</div>
            <div class="kpi-value">${DATA.length.toLocaleString('es-AR')}</div>
            <div class="kpi-sub">En período seleccionado</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Orden máxima</div>
            <div class="kpi-value">${fmt(maxOrder)}</div>
            <div class="kpi-sub">Mayor ticket individual</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Clientes únicos</div>
            <div class="kpi-value">${uniqueClients.toLocaleString('es-AR')}</div>
            <div class="kpi-sub">DNIs distintos</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Revenue total</div>
            <div class="kpi-value">${fmtK(totalRevenue)}</div>
            <div class="kpi-sub">Suma de todas las órdenes</div>
        </div>
    `;

    // AOV por tienda
    const tiendaMap = {};
    DATA.forEach(o => {
        const t = o.tienda || 'Sin tienda';
        if (!tiendaMap[t]) tiendaMap[t] = { total: 0, count: 0 };
        tiendaMap[t].total += o.total;
        tiendaMap[t].count++;
    });
    const tiendas = Object.entries(tiendaMap).sort((a,b) => b[1].total - a[1].total);
    document.getElementById('tiendaCards').innerHTML = tiendas.map(([t, v]) => `
        <div class="tienda-card">
            <div class="tienda-name">${t}</div>
            <div class="tienda-aov">${fmt(v.total / v.count)}</div>
            <div class="tienda-meta">${v.count.toLocaleString('es-AR')} órdenes · ${fmtK(v.total)} total</div>
        </div>
    `).join('');

    // Evolución mensual
    const monthMap = {};
    DATA.forEach(o => {
        if (!o.fecha) return;
        const key = o.fecha.substring(0, 7); // YYYY-MM
        if (!monthMap[key]) monthMap[key] = { total: 0, count: 0 };
        monthMap[key].total += o.total;
        monthMap[key].count++;
    });
    const months = Object.keys(monthMap).sort();
    const aovByMonth = months.map(m => monthMap[m].total / monthMap[m].count);

    Object.values(CHARTS).forEach(c => c.destroy());
    CHARTS = {};

    CHARTS.evol = new Chart(document.getElementById('chartEvol'), {
        type: 'line',
        data: {
            labels: months.map(m => { const [y,mo] = m.split('-'); return `${mo}/${y.slice(2)}`; }),
            datasets: [{
                label: 'AOV',
                data: aovByMonth,
                borderColor: '#16a97e',
                backgroundColor: 'rgba(22,169,126,.08)',
                borderWidth: 2,
                pointRadius: 3,
                pointBackgroundColor: '#16a97e',
                fill: true,
                tension: .35,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${fmt(ctx.raw)}` } } },
            scales: {
                x: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#5c6478', font: { size: 11 }, maxTicksLimit: 12 } },
                y: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#5c6478', font: { size: 11 }, callback: v => fmtK(v) } }
            }
        }
    });

    // Distribución de tickets
    const ranges = [
        { label: '$0 — $10k',     min: 0,      max: 10000 },
        { label: '$10k — $25k',   min: 10000,  max: 25000 },
        { label: '$25k — $50k',   min: 25000,  max: 50000 },
        { label: '$50k — $100k',  min: 50000,  max: 100000 },
        { label: '$100k — $200k', min: 100000, max: 200000 },
        { label: '$200k+',        min: 200000, max: Infinity },
    ];
    const distCounts = ranges.map(r => DATA.filter(o => o.total >= r.min && o.total < r.max).length);
    const maxCount = Math.max(...distCounts);

    document.getElementById('distRows').innerHTML = ranges.map((r, i) => `
        <div class="dist-row">
            <div class="dist-range">${r.label}</div>
            <div class="dist-bar-wrap"><div class="dist-bar" style="width:${maxCount ? (distCounts[i]/maxCount*100) : 0}%"></div></div>
            <div class="dist-count">${distCounts[i].toLocaleString('es-AR')}</div>
            <div class="dist-pct">${DATA.length ? (distCounts[i]/DATA.length*100).toFixed(1) : 0}%</div>
        </div>
    `).join('');

    CHARTS.dist = new Chart(document.getElementById('chartDist'), {
        type: 'bar',
        data: {
            labels: ranges.map(r => r.label),
            datasets: [{
                data: distCounts,
                backgroundColor: ['#16a97e','#3b6bff','#f59e0b','#8b5cf6','#ef4444','#ec4899'],
                borderRadius: 6,
                borderSkipped: false,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false }, ticks: { color: '#5c6478', font: { size: 10 }, maxRotation: 30 } },
                y: { grid: { color: 'rgba(255,255,255,.04)' }, ticks: { color: '#5c6478', font: { size: 11 } } }
            }
        }
    });

    // AOV por tienda — donut
    const colors = ['#16a97e','#3b6bff','#f59e0b','#8b5cf6','#ef4444'];
    CHARTS.tienda = new Chart(document.getElementById('chartTienda'), {
        type: 'doughnut',
        data: {
            labels: tiendas.map(([t]) => t),
            datasets: [{
                data: tiendas.map(([,v]) => Math.round(v.total / v.count)),
                backgroundColor: colors,
                borderWidth: 0,
                hoverOffset: 6,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position: 'right', labels: { color: '#9ba3b8', font: { size: 11 }, boxWidth: 10, padding: 12 } },
                tooltip: { callbacks: { label: ctx => ` AOV: ${fmt(ctx.raw)}` } }
            },
            cutout: '60%',
        }
    });
}

function calcMedian(arr) {
    const sorted = [...arr].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}
</script>
</body>
</html>
