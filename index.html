<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOV Analytics — FYnutrition & Hairfy</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --green:#16a97e; --green-light:#e6f7f2; --green-dark:#0d7a5a;
            --blue:#2563eb;  --blue-light:#eff6ff;
            --orange:#f59e0b; --orange-light:#fffbeb;
            --red:#ef4444;   --red-light:#fef2f2;
            --purple:#8b5cf6; --purple-light:#f5f3ff;
            --pink:#ec4899;
            --hairfy:#8b5cf6; --hairfy-light:#f5f3ff; --hairfy-dark:#6d28d9;
            --fyn:#16a97e;   --fyn-light:#e6f7f2;    --fyn-dark:#0d7a5a;
            --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f9fafb;
            --border:#e5e7eb; --border-dark:#d1d5db;
            --text-1:#111827; --text-2:#374151; --text-3:#6b7280; --text-4:#9ca3af;
            --radius:12px; --radius-lg:16px;
        }
        body.dark {
            --bg:#0f1117; --surface:#1a1d27; --surface-2:#22263a;
            --border:#2d3148; --border-dark:#3a3f5c;
            --text-1:#f1f5f9; --text-2:#cbd5e1; --text-3:#94a3b8; --text-4:#64748b;
            --green-light:#0d3d2e; --blue-light:#1e2a4a; --orange-light:#3a2e10;
            --red-light:#3a1515; --purple-light:#2d1f4a; --hairfy-light:#2d1f4a; --fyn-light:#0d3d2e;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text-1); min-height:100vh; transition:background .3s,color .3s; }

        /* ── TOPBAR ── */
        .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 28px; height:60px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
        .topbar-left { display:flex; align-items:center; gap:12px; }
        .logo-dot { width:28px; height:28px; background:var(--green); border-radius:8px; display:grid; place-items:center; color:#fff; font-size:13px; }
        .topbar-title { font-size:15px; font-weight:600; color:var(--text-1); }
        .topbar-right { display:flex; align-items:center; gap:10px; }
        .btn-sync { display:flex; align-items:center; gap:7px; padding:8px 16px; background:var(--green); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; transition:background .15s; }
        .btn-sync:hover { background:var(--green-dark); }
        .btn-sync.loading i { animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .status-dot { width:8px; height:8px; border-radius:50%; background:var(--text-4); transition:background .3s; }
        .status-dot.ok { background:var(--green); }
        .theme-btn { padding:7px 12px; border:1px solid var(--border-dark); border-radius:8px; background:none; color:var(--text-3); font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; }
        .theme-btn:hover { background:var(--surface-2); }

        /* ── TABS ── */
        .tabs-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:0 28px; display:flex; align-items:flex-end; gap:2px; }
        .tab-btn { padding:14px 20px 12px; font-size:13px; font-weight:600; font-family:'DM Sans',sans-serif; border:none; background:none; color:var(--text-3); cursor:pointer; border-bottom:3px solid transparent; transition:all .15s; display:flex; align-items:center; gap:7px; }
        .tab-btn:hover { color:var(--text-1); }
        .tab-btn.active { color:var(--text-1); border-bottom-color:var(--tab-color, var(--green)); }
        .tab-btn .tab-dot { width:8px; height:8px; border-radius:50%; background:var(--tab-color, var(--green)); }
        .tab-btn[data-tab="general"] { --tab-color: var(--green); }
        .tab-btn[data-tab="hairfy"]  { --tab-color: var(--hairfy); }
        .tab-btn[data-tab="fyn"]     { --tab-color: var(--fyn); }

        /* ── FILTERS BAR ── */
        .filters-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 28px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .filter-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-4); margin-right:2px; }
        .filter-btn { padding:5px 14px; border-radius:7px; border:1px solid var(--border); background:none; color:var(--text-3); font-family:'DM Sans',sans-serif; font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
        .filter-btn:hover { border-color:var(--green); color:var(--green); }
        .filter-btn.active { background:var(--green-light); border-color:var(--green); color:var(--green-dark); font-weight:600; }
        body.dark .filter-btn.active { color:#34d399; }
        .evol-select { padding:5px 10px; border:1px solid var(--border-dark); border-radius:7px; background:var(--surface-2); color:var(--text-1); font-family:'DM Sans',sans-serif; font-size:12px; outline:none; cursor:pointer; }
        .filter-sep { width:1px; height:18px; background:var(--border); margin:0 6px; }

        /* ── CONTENT ── */
        .content { padding:28px; max-width:1400px; margin:0 auto; }
        .tab-panel { display:none; }
        .tab-panel.active { display:block; }

        /* ── KPIs ── */
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:14px; margin-bottom:20px; }
        .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:18px 20px; }
        .kpi-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
        .kpi-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); }
        .kpi-icon { width:30px; height:30px; border-radius:7px; display:grid; place-items:center; font-size:12px; }
        .kpi-icon.green  { background:var(--green-light);  color:var(--green); }
        .kpi-icon.blue   { background:var(--blue-light);   color:var(--blue); }
        .kpi-icon.orange { background:var(--orange-light); color:var(--orange); }
        .kpi-icon.red    { background:var(--red-light);    color:var(--red); }
        .kpi-icon.purple { background:var(--purple-light); color:var(--purple); }
        .kpi-value { font-size:24px; font-weight:700; color:var(--text-1); letter-spacing:-.5px; line-height:1; }

        /* ── CARDS ── */
        .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; margin-bottom:16px; }
        .chart-card.no-mb { margin-bottom:0; }
        .charts-grid .chart-card { margin-bottom:0; }
        .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .card-title { font-size:13.5px; font-weight:600; color:var(--text-1); }
        .card-sub { font-size:11.5px; color:var(--text-3); margin-top:2px; }
        .chart-wrap { position:relative; height:240px; }
        .chart-wrap-lg { position:relative; height:280px; }

        /* ── TIENDA CARDS ── */
        .tienda-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
        .tienda-card { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; position:relative; overflow:hidden; }
        .tienda-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
        .tienda-card.t0::before { background:var(--green); }
        .tienda-card.t1::before { background:var(--blue); }
        .tienda-card.t2::before { background:var(--orange); }
        .tienda-card.t3::before { background:var(--purple); }
        .tienda-name { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--text-4); margin-bottom:6px; }
        .tienda-aov { font-size:20px; font-weight:700; color:var(--text-1); letter-spacing:-.3px; }
        .tienda-orders { font-size:11px; color:var(--text-3); margin-top:4px; }

        /* ── EVOL CONTROLS ── */
        .evol-controls { display:flex; align-items:center; gap:6px; }

        /* ── DIST ── */
        .dist-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
        .dist-row:last-child { border-bottom:none; }
        .dist-range { font-family:'DM Mono',monospace; font-size:11.5px; color:var(--text-2); width:138px; flex-shrink:0; }
        .dist-bar-wrap { flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
        .dist-bar { height:100%; border-radius:3px; transition:width .6s ease; }
        .dist-count { font-size:12px; color:var(--text-3); width:60px; text-align:right; flex-shrink:0; }
        .dist-pct { font-family:'DM Mono',monospace; font-size:11.5px; width:42px; text-align:right; flex-shrink:0; }

        /* ── MARCA SECTION (tabs Hairfy/FYN) ── */
        .brand-section { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; margin-bottom:16px; }
        .brand-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
        .brand-badge { padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
        .brand-badge.hairfy { background:var(--hairfy-light); color:var(--hairfy); }
        .brand-badge.fyn    { background:var(--fyn-light);    color:var(--fyn); }
        .brand-title { font-size:14px; font-weight:600; color:var(--text-1); }

        /* ── TOP PRODUCTS ── */
        .prod-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); }
        .prod-row:last-child { border-bottom:none; }
        .prod-rank { font-family:'DM Mono',monospace; font-size:11px; color:var(--text-4); width:18px; flex-shrink:0; }
        .prod-name { flex:1; font-size:12.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .prod-aov  { font-size:12.5px; font-weight:600; color:var(--text-1); flex-shrink:0; }
        .prod-cnt  { font-size:11px; color:var(--text-3); width:60px; text-align:right; flex-shrink:0; }

        /* ── MISC ── */
        .empty { padding:48px; text-align:center; color:var(--text-4); font-size:13px; }
        .loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:999; place-items:center; }
        .loading-overlay.show { display:grid; }
        .loading-box { background:var(--surface); border-radius:14px; padding:28px 36px; display:flex; align-items:center; gap:14px; font-size:14px; font-weight:600; color:var(--text-1); }
        .spinner { width:20px; height:20px; border:2.5px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
        .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        .two-col .chart-card { margin-bottom:0; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box"><div class="spinner"></div> Cargando datos…</div>
</div>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-left">
        <div class="logo-dot"><i class="fas fa-bolt"></i></div>
        <span class="topbar-title">AOV Analytics</span>
    </div>
    <div class="topbar-right">
        <div class="status-dot" id="statusDot"></div>
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">Modo Noche</button>
        <button class="btn-sync" id="syncBtn" onclick="loadData()">
            <i class="fas fa-sync-alt"></i> Sincronizar
        </button>
    </div>
</header>

<!-- TABS -->
<div class="tabs-bar">
    <button class="tab-btn active" data-tab="general" onclick="switchTab('general')">
        <span class="tab-dot"></span> General
    </button>
    <button class="tab-btn" data-tab="hairfy" onclick="switchTab('hairfy')">
        <span class="tab-dot"></span> Hairfy
    </button>
    <button class="tab-btn" data-tab="fyn" onclick="switchTab('fyn')">
        <span class="tab-dot"></span> FYnutrition
    </button>
</div>

<!-- FILTERS (shared, one bar per tab, rendered inside each panel) -->

<!-- CONTENT -->
<div class="content" id="mainContent">
    <!-- General -->
    <div class="tab-panel active" id="panel-general">
        <div class="filters-bar" style="margin:-28px -28px 28px; border-radius:0; border-left:none; border-right:none; border-top:none;">
            <span class="filter-label">Tienda</span>
            <button class="filter-btn active" data-tienda="" onclick="setTienda(this,'general')">Todas</button>
            <div id="tiendaBtns-general"></div>
            <div class="filter-sep"></div>
            <span class="filter-label">Año</span>
            <select class="evol-select" id="yearFilter-general" onchange="applyFilters('general')">
                <option value="">Todos</option>
            </select>
            <span class="filter-label" style="margin-left:8px;">Mes</span>
            <select class="evol-select" id="monthFilter-general" onchange="applyFilters('general')">
                <option value="">Todos</option>
                <option value="01">Enero</option><option value="02">Febrero</option>
                <option value="03">Marzo</option><option value="04">Abril</option>
                <option value="05">Mayo</option><option value="06">Junio</option>
                <option value="07">Julio</option><option value="08">Agosto</option>
                <option value="09">Septiembre</option><option value="10">Octubre</option>
                <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
        </div>
        <div id="body-general"><div class="empty">Hacé click en Sincronizar para cargar el análisis</div></div>
    </div>

    <!-- Hairfy -->
    <div class="tab-panel" id="panel-hairfy">
        <div class="filters-bar" style="margin:-28px -28px 28px; border-radius:0; border-left:none; border-right:none; border-top:none;">
            <span class="filter-label">Tienda</span>
            <button class="filter-btn active" data-tienda="" onclick="setTienda(this,'hairfy')">Todas</button>
            <div id="tiendaBtns-hairfy"></div>
            <div class="filter-sep"></div>
            <span class="filter-label">Año</span>
            <select class="evol-select" id="yearFilter-hairfy" onchange="applyFilters('hairfy')">
                <option value="">Todos</option>
            </select>
            <span class="filter-label" style="margin-left:8px;">Mes</span>
            <select class="evol-select" id="monthFilter-hairfy" onchange="applyFilters('hairfy')">
                <option value="">Todos</option>
                <option value="01">Enero</option><option value="02">Febrero</option>
                <option value="03">Marzo</option><option value="04">Abril</option>
                <option value="05">Mayo</option><option value="06">Junio</option>
                <option value="07">Julio</option><option value="08">Agosto</option>
                <option value="09">Septiembre</option><option value="10">Octubre</option>
                <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
        </div>
        <div id="body-hairfy"><div class="empty">Hacé click en Sincronizar para cargar el análisis</div></div>
    </div>

    <!-- FYnutrition -->
    <div class="tab-panel" id="panel-fyn">
        <div class="filters-bar" style="margin:-28px -28px 28px; border-radius:0; border-left:none; border-right:none; border-top:none;">
            <span class="filter-label">Tienda</span>
            <button class="filter-btn active" data-tienda="" onclick="setTienda(this,'fyn')">Todas</button>
            <div id="tiendaBtns-fyn"></div>
            <div class="filter-sep"></div>
            <span class="filter-label">Año</span>
            <select class="evol-select" id="yearFilter-fyn" onchange="applyFilters('fyn')">
                <option value="">Todos</option>
            </select>
            <span class="filter-label" style="margin-left:8px;">Mes</span>
            <select class="evol-select" id="monthFilter-fyn" onchange="applyFilters('fyn')">
                <option value="">Todos</option>
                <option value="01">Enero</option><option value="02">Febrero</option>
                <option value="03">Marzo</option><option value="04">Abril</option>
                <option value="05">Mayo</option><option value="06">Junio</option>
                <option value="07">Julio</option><option value="08">Agosto</option>
                <option value="09">Septiembre</option><option value="10">Octubre</option>
                <option value="11">Noviembre</option><option value="12">Diciembre</option>
            </select>
        </div>
        <div id="body-fyn"><div class="empty">Hacé click en Sincronizar para cargar el análisis</div></div>
    </div>
</div>

<script>
const SUPA_URL = 'https://tilsqawlwgbuttyboxpn.supabase.co';
const SUPA_KEY = 'sb_publishable_14OWO27CxU7Cml4rwtvBlg_8RR-6sGm';

let RAW_ORDERS  = [];   // todas las órdenes agrupadas por num_venta
let SKU_MARCA   = {};   // { sku: 'Hairfy' | 'FYnutrition' }
let TIENDAS     = [];
let CHARTS      = {};   // { tabId_chartName: Chart }
let activeTab   = 'general';

// Por tab: tienda activa + drill-down de evolución
const STATE = {
    general: { tienda:'', evolYear:'', evolMonth:'' },
    hairfy:  { tienda:'', evolYear:'', evolMonth:'' },
    fyn:     { tienda:'', evolYear:'', evolMonth:'' },
};

const MARCA_FILTER = { general: null, hairfy: 'Hairfy', fyn: 'FYnutrition' };

function fmt(n)  { return '$' + Math.round(n).toLocaleString('es-AR'); }
function fmtK(n) { return n>=1e6 ? '$'+(n/1e6).toFixed(1)+'M' : n>=1000 ? '$'+(n/1000).toFixed(0)+'k' : fmt(n); }

// ── TABS ──────────────────────────────────────────────────────────────────
function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+tab));
    if (RAW_ORDERS.length) applyFilters(tab);
}

// ── LOAD ──────────────────────────────────────────────────────────────────
async function loadData() {
    const overlay   = document.getElementById('loadingOverlay');
    const syncBtn   = document.getElementById('syncBtn');
    const statusDot = document.getElementById('statusDot');
    overlay.classList.add('show');
    syncBtn.classList.add('loading');
    statusDot.classList.remove('ok');

    try {
        // 1. Fetch ventas (paginado)
        let allRows = [];
        let from = 0;
        const pageSize = 1000;
        while (true) {
            const res = await fetch(
                `${SUPA_URL}/rest/v1/ventas?select=num_venta,fecha,total_ars,tienda,dni,sku&total_ars=gt.0&limit=${pageSize}&offset=${from}`,
                { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
            );
            if (!res.ok) throw new Error(`Error ${res.status}`);
            const page = await res.json();
            allRows = allRows.concat(page);
            if (page.length < pageSize) break;
            from += pageSize;
        }

        // 2. Fetch productos → mapa sku→marca
        const prodRes = await fetch(
            `${SUPA_URL}/rest/v1/productos?select=sku,marca&limit=1000`,
            { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
        );
        if (prodRes.ok) {
            const prods = await prodRes.json();
            prods.forEach(p => { if (p.sku && p.marca) SKU_MARCA[p.sku] = p.marca; });
        }

        // 3. Agrupar por num_venta
        const map = {};
        allRows.forEach(r => {
            if (!r.num_venta) return;
            if (!map[r.num_venta]) {
                map[r.num_venta] = {
                    total: 0, fecha: r.fecha||'', tienda: r.tienda||'',
                    dni: r.dni||'', sku: r.sku||''
                };
            }
            map[r.num_venta].total += parseFloat(r.total_ars)||0;
            // Si no tiene sku en el primer row, intentar del siguiente
            if (!map[r.num_venta].sku && r.sku) map[r.num_venta].sku = r.sku;
        });

        RAW_ORDERS = Object.values(map).filter(o => o.total > 0);

        // 4. Enriquecer con marca
        RAW_ORDERS.forEach(o => {
            o.marca = SKU_MARCA[o.sku] || '';
        });

        // 5. Tiendas únicas
        TIENDAS = [...new Set(RAW_ORDERS.map(o => o.tienda).filter(Boolean))].sort();

        // 6. Poblar selects de años para cada tab
        const years = [...new Set(RAW_ORDERS.map(o => o.fecha?.substring(0,4)).filter(Boolean))].sort();
        ['general','hairfy','fyn'].forEach(tab => {
            // tienda buttons
            const marcaFilter = MARCA_FILTER[tab];
            const tiendas = tab === 'general' ? TIENDAS :
                [...new Set(RAW_ORDERS.filter(o => !marcaFilter || o.marca === marcaFilter).map(o => o.tienda).filter(Boolean))].sort();
            document.getElementById('tiendaBtns-'+tab).innerHTML = tiendas.map(t =>
                `<button class="filter-btn" data-tienda="${t}" onclick="setTienda(this,'${tab}')">${t}</button>`
            ).join('');
            // years
            const yearSel = document.getElementById('yearFilter-'+tab);
            yearSel.innerHTML = '<option value="">Todos</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
        });

        statusDot.classList.add('ok');
        applyFilters('general');
        applyFilters('hairfy');
        applyFilters('fyn');
    } catch(e) {
        console.error(e);
        alert('Error: ' + e.message);
    } finally {
        overlay.classList.remove('show');
        syncBtn.classList.remove('loading');
    }
}

// ── FILTERS ───────────────────────────────────────────────────────────────
function setTienda(el, tab) {
    document.querySelectorAll(`#panel-${tab} [data-tienda]`).forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    STATE[tab].tienda = el.dataset.tienda;
    STATE[tab].evolYear  = '';
    STATE[tab].evolMonth = '';
    applyFilters(tab);
}

function applyFilters(tab) {
    const year  = document.getElementById('yearFilter-'+tab)?.value  || '';
    const month = document.getElementById('monthFilter-'+tab)?.value || '';
    render(tab, year, month);
}

function getFiltered(tab, year, month) {
    const marcaFilter = MARCA_FILTER[tab];
    return RAW_ORDERS.filter(o => {
        if (marcaFilter && o.marca !== marcaFilter) return false;
        if (STATE[tab].tienda && o.tienda !== STATE[tab].tienda) return false;
        if (year  && !o.fecha?.startsWith(year))          return false;
        if (month && o.fecha?.substring(5,7) !== month)   return false;
        return true;
    });
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render(tab, year='', month='') {
    const DATA = getFiltered(tab, year, month);
    const bodyEl = document.getElementById('body-'+tab);
    if (!DATA.length) { bodyEl.innerHTML = '<div class="empty">Sin datos para los filtros seleccionados</div>'; return; }

    const revenue = DATA.reduce((s,o) => s+o.total, 0);
    const orders  = DATA.length;
    const aov     = revenue / orders;
    const median  = calcMedian(DATA.map(o => o.total));
    const maxOrd  = Math.max(...DATA.map(o => o.total));
    const clients = new Set(DATA.map(o => o.dni).filter(x => x && x !== 'S/D')).size;

    const isGeneral = tab === 'general';

    bodyEl.innerHTML = `
        <div class="kpi-grid">
            <div class="kpi"><div class="kpi-header"><span class="kpi-label">AOV General</span><div class="kpi-icon green"><i class="fas fa-dollar-sign"></i></div></div><div class="kpi-value">${fmt(aov)}</div></div>
            <div class="kpi"><div class="kpi-header"><span class="kpi-label">Mediana</span><div class="kpi-icon blue"><i class="fas fa-chart-line"></i></div></div><div class="kpi-value">${fmt(median)}</div></div>
            <div class="kpi"><div class="kpi-header"><span class="kpi-label">Órdenes</span><div class="kpi-icon orange"><i class="fas fa-receipt"></i></div></div><div class="kpi-value">${orders.toLocaleString('es-AR')}</div></div>
            <div class="kpi"><div class="kpi-header"><span class="kpi-label">Orden Máxima</span><div class="kpi-icon red"><i class="fas fa-arrow-up"></i></div></div><div class="kpi-value">${fmt(maxOrd)}</div></div>
            <div class="kpi"><div class="kpi-header"><span class="kpi-label">Clientes Únicos</span><div class="kpi-icon purple"><i class="fas fa-user"></i></div></div><div class="kpi-value">${clients.toLocaleString('es-AR')}</div></div>
            <div class="kpi"><div class="kpi-header"><span class="kpi-label">Revenue Total</span><div class="kpi-icon green"><i class="fas fa-coins"></i></div></div><div class="kpi-value">${fmtK(revenue)}</div></div>
        </div>

        <div class="chart-card">
            <div class="card-header"><div class="card-title">AOV por tienda</div></div>
            <div class="tienda-grid" id="tiendaCards-${tab}"></div>
        </div>

        <div class="chart-card">
            <div class="card-header">
                <div class="card-title" id="evolTitle-${tab}">Evolución del AOV por año</div>
                <div class="evol-controls" id="evolControls-${tab}"></div>
            </div>
            <div class="chart-wrap-lg"><canvas id="chartEvol-${tab}"></canvas></div>
        </div>

        <div class="two-col">
            <div class="chart-card">
                <div class="card-header"><div class="card-title">Distribución de tickets</div></div>
                <div id="distRows-${tab}"></div>
            </div>
            <div class="chart-card">
                <div class="card-header"><div class="card-title">Órdenes por rango</div></div>
                <div class="chart-wrap"><canvas id="chartDist-${tab}"></canvas></div>
            </div>
        </div>

        ${isGeneral ? renderBrandCompareHTML() : renderTopProductsHTML(tab)}
    `;

    renderTiendaCards(tab, year, month);
    renderEvol(tab, year, month);
    renderDist(tab, DATA);
    if (isGeneral) renderBrandCompare(tab, year, month);
    else renderTopProducts(tab, DATA);
}

// ── TIENDA CARDS ──────────────────────────────────────────────────────────
function renderTiendaCards(tab, year, month) {
    const marcaFilter = MARCA_FILTER[tab];
    const tiendaMap = {};
    RAW_ORDERS.forEach(o => {
        if (marcaFilter && o.marca !== marcaFilter) return;
        if (year  && !o.fecha?.startsWith(year))          return;
        if (month && o.fecha?.substring(5,7) !== month)   return;
        const t = o.tienda || 'Sin tienda';
        if (!tiendaMap[t]) tiendaMap[t] = { total:0, count:0 };
        tiendaMap[t].total += o.total;
        tiendaMap[t].count++;
    });
    const colors = ['t0','t1','t2','t3'];
    const tiendas = Object.entries(tiendaMap).sort((a,b) => b[1].total - a[1].total);
    const el = document.getElementById('tiendaCards-'+tab);
    if (!el) return;
    el.innerHTML = tiendas.map(([t,v],i) => `
        <div class="tienda-card ${colors[i]||'t3'}">
            <div class="tienda-name">${t}</div>
            <div class="tienda-aov">${fmt(v.total/v.count)}</div>
            <div class="tienda-orders">${v.count.toLocaleString('es-AR')} órdenes · ${fmtK(v.total)}</div>
        </div>
    `).join('');
}

// ── EVOLUCIÓN ─────────────────────────────────────────────────────────────
// La evolución tiene su propio drill-down POR TAB, independiente de los filtros año/mes
function renderEvol(tab, yearFilter, monthFilter) {
    const { evolYear, evolMonth } = STATE[tab];
    const marcaFilter = MARCA_FILTER[tab];
    const tiendaFilter = STATE[tab].tienda;

    // Base data: respeta tienda y marca pero NO el año/mes global (la evolución muestra toda la historia)
    const BASE = RAW_ORDERS.filter(o => {
        if (marcaFilter && o.marca !== marcaFilter) return false;
        if (tiendaFilter && o.tienda !== tiendaFilter) return false;
        return true;
    });

    const years = [...new Set(BASE.map(o => o.fecha?.substring(0,4)).filter(Boolean))].sort();

    // Controles
    let controlsHTML = '';
    if (evolYear || evolMonth) {
        controlsHTML += `<button class="filter-btn active" onclick="drillUp('${tab}')" style="margin-right:4px;font-size:11px;padding:4px 10px;">← Volver</button>`;
    }
    controlsHTML += `<select class="evol-select" id="yearSel-${tab}" onchange="drillYear('${tab}',this.value)">
        <option value="">Todos los años</option>
        ${years.map(y => `<option value="${y}"${evolYear===y?' selected':''}>${y}</option>`).join('')}
    </select>`;
    if (evolYear) {
        const months = [...new Set(BASE.filter(o => o.fecha?.startsWith(evolYear)).map(o => o.fecha?.substring(0,7)).filter(Boolean))].sort();
        controlsHTML += `<select class="evol-select" id="monthSel-${tab}" onchange="drillMonth('${tab}',this.value)" style="margin-left:6px;">
            <option value="">Todos los meses</option>
            ${months.map(m => `<option value="${m}"${evolMonth===m?' selected':''}>${m}</option>`).join('')}
        </select>`;
    }
    const ctrlEl = document.getElementById('evolControls-'+tab);
    const titleEl = document.getElementById('evolTitle-'+tab);
    if (ctrlEl) ctrlEl.innerHTML = controlsHTML;

    let labels=[], aovData=[], countData=[];

    if (evolMonth) {
        if (titleEl) titleEl.textContent = `AOV diario — ${evolMonth}`;
        const days = {};
        BASE.filter(o => o.fecha?.startsWith(evolMonth)).forEach(o => {
            if (!days[o.fecha]) days[o.fecha] = { total:0, count:0 };
            days[o.fecha].total += o.total; days[o.fecha].count++;
        });
        labels    = Object.keys(days).sort().map(d => d.substring(8));
        aovData   = Object.keys(days).sort().map(d => days[d].total/days[d].count);
        countData = Object.keys(days).sort().map(d => days[d].count);
    } else if (evolYear) {
        if (titleEl) titleEl.textContent = `AOV mensual — ${evolYear}`;
        const months = {};
        BASE.filter(o => o.fecha?.startsWith(evolYear)).forEach(o => {
            const m = o.fecha?.substring(0,7); if (!m) return;
            if (!months[m]) months[m] = { total:0, count:0 };
            months[m].total += o.total; months[m].count++;
        });
        labels    = Object.keys(months).sort().map(m => m.substring(5));
        aovData   = Object.keys(months).sort().map(m => months[m].total/months[m].count);
        countData = Object.keys(months).sort().map(m => months[m].count);
    } else {
        if (titleEl) titleEl.textContent = 'Evolución del AOV por año';
        const yMap = {};
        BASE.forEach(o => {
            const y = o.fecha?.substring(0,4); if (!y) return;
            if (!yMap[y]) yMap[y] = { total:0, count:0 };
            yMap[y].total += o.total; yMap[y].count++;
        });
        labels    = Object.keys(yMap).sort();
        aovData   = Object.keys(yMap).sort().map(y => yMap[y].total/yMap[y].count);
        countData = Object.keys(yMap).sort().map(y => yMap[y].count);
    }

    const cKey = tab+'_evol';
    if (CHARTS[cKey]) CHARTS[cKey].destroy();
    const canvas = document.getElementById('chartEvol-'+tab);
    if (!canvas) return;
    const isDark = document.body.classList.contains('dark');
    const gridColor = isDark ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.04)';
    CHARTS[cKey] = new Chart(canvas, {
        type:'line',
        data:{ labels, datasets:[
            { label:'AOV', data:aovData, borderColor:'#16a97e', backgroundColor:'rgba(22,169,126,.08)', borderWidth:2.5, pointRadius:4, pointBackgroundColor:'#16a97e', fill:true, tension:.3, yAxisID:'y' },
            { label:'Órdenes', data:countData, borderColor:'#2563eb', backgroundColor:'transparent', borderWidth:1.5, pointRadius:3, pointBackgroundColor:'#2563eb', borderDash:[4,3], tension:.3, yAxisID:'y2' }
        ]},
        options:{
            responsive:true, maintainAspectRatio:false,
            onClick:(e,els) => {
                if (!els.length) return;
                const idx = els[0].index;
                if (!evolYear && !evolMonth) drillYear(tab, labels[idx]);
                else if (evolYear && !evolMonth) drillMonth(tab, evolYear+'-'+labels[idx]);
            },
            plugins:{
                legend:{ position:'top', align:'end', labels:{ font:{family:'DM Sans',size:11}, boxWidth:10, padding:16 }},
                tooltip:{ callbacks:{ label:ctx => ctx.datasetIndex===0 ? ` AOV: ${fmt(ctx.raw)}` : ` Órdenes: ${ctx.raw}` }}
            },
            scales:{
                x:{ grid:{color:gridColor}, ticks:{color:'#6b7280',font:{size:11}}},
                y:{ grid:{color:gridColor}, ticks:{color:'#16a97e',font:{size:11},callback:v=>fmtK(v)}, position:'left'},
                y2:{ grid:{display:false}, ticks:{color:'#2563eb',font:{size:11}}, position:'right'}
            }
        }
    });
}

function drillYear(tab, year) {
    STATE[tab].evolYear  = year;
    STATE[tab].evolMonth = '';
    const y = document.getElementById('yearFilter-'+tab)?.value || '';
    const m = document.getElementById('monthFilter-'+tab)?.value || '';
    render(tab, y, m);
}
function drillMonth(tab, month) {
    STATE[tab].evolMonth = month;
    const y = document.getElementById('yearFilter-'+tab)?.value || '';
    const m = document.getElementById('monthFilter-'+tab)?.value || '';
    render(tab, y, m);
}
function drillUp(tab) {
    if (STATE[tab].evolMonth) STATE[tab].evolMonth = '';
    else STATE[tab].evolYear = '';
    const y = document.getElementById('yearFilter-'+tab)?.value || '';
    const m = document.getElementById('monthFilter-'+tab)?.value || '';
    render(tab, y, m);
}

// ── DISTRIBUCIÓN ──────────────────────────────────────────────────────────
function renderDist(tab, DATA) {
    const ranges = [
        { label:'$0 — $10k',     min:0,      max:10000,   color:'#16a97e' },
        { label:'$10k — $25k',   min:10000,  max:25000,   color:'#2563eb' },
        { label:'$25k — $50k',   min:25000,  max:50000,   color:'#f59e0b' },
        { label:'$50k — $100k',  min:50000,  max:100000,  color:'#8b5cf6' },
        { label:'$100k — $200k', min:100000, max:200000,  color:'#ef4444' },
        { label:'$200k+',        min:200000, max:Infinity,color:'#ec4899' },
    ];
    const counts = ranges.map(r => DATA.filter(o => o.total>=r.min && o.total<r.max).length);
    const maxC   = Math.max(...counts);
    const distEl = document.getElementById('distRows-'+tab);
    if (distEl) distEl.innerHTML = ranges.map((r,i) => `
        <div class="dist-row">
            <div class="dist-range">${r.label}</div>
            <div class="dist-bar-wrap"><div class="dist-bar" style="width:${maxC?(counts[i]/maxC*100):0}%;background:${r.color};"></div></div>
            <div class="dist-count">${counts[i].toLocaleString('es-AR')}</div>
            <div class="dist-pct" style="color:${r.color}">${DATA.length?(counts[i]/DATA.length*100).toFixed(1):0}%</div>
        </div>
    `).join('');

    const cKey = tab+'_dist';
    if (CHARTS[cKey]) CHARTS[cKey].destroy();
    const canvas = document.getElementById('chartDist-'+tab);
    if (!canvas) return;
    CHARTS[cKey] = new Chart(canvas, {
        type:'bar',
        data:{ labels:ranges.map(r=>r.label), datasets:[{ data:counts, backgroundColor:ranges.map(r=>r.color), borderRadius:6, borderSkipped:false }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
            scales:{ x:{grid:{display:false},ticks:{color:'#6b7280',font:{size:10},maxRotation:30}}, y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#6b7280',font:{size:11}}} }
        }
    });
}

// ── BRAND COMPARE (solo en General) ──────────────────────────────────────
function renderBrandCompareHTML() {
    return `
        <div class="two-col">
            <div class="chart-card">
                <div class="card-header">
                    <div><div class="card-title">Hairfy — AOV por tienda</div><div class="card-sub">Marca Hairfy</div></div>
                    <span class="brand-badge hairfy">Hairfy</span>
                </div>
                <div class="tienda-grid" id="brandCards-hairfy"></div>
            </div>
            <div class="chart-card">
                <div class="card-header">
                    <div><div class="card-title">FYnutrition — AOV por tienda</div><div class="card-sub">Marca FYnutrition</div></div>
                    <span class="brand-badge fyn">FYnutrition</span>
                </div>
                <div class="tienda-grid" id="brandCards-fyn"></div>
            </div>
        </div>
    `;
}
function renderBrandCompare(tab, year, month) {
    ['Hairfy','FYnutrition'].forEach(marca => {
        const key = marca === 'Hairfy' ? 'hairfy' : 'fyn';
        const tiendaMap = {};
        RAW_ORDERS.forEach(o => {
            if (o.marca !== marca) return;
            if (year  && !o.fecha?.startsWith(year))          return;
            if (month && o.fecha?.substring(5,7) !== month)   return;
            const t = o.tienda || 'Sin tienda';
            if (!tiendaMap[t]) tiendaMap[t] = { total:0, count:0 };
            tiendaMap[t].total += o.total; tiendaMap[t].count++;
        });
        const colors = ['t0','t1','t2','t3'];
        const tiendas = Object.entries(tiendaMap).sort((a,b) => b[1].total - a[1].total);
        const el = document.getElementById('brandCards-'+key);
        if (!el) return;
        if (!tiendas.length) { el.innerHTML = '<div style="font-size:12px;color:var(--text-4);padding:8px 0;">Sin datos con marca asignada</div>'; return; }
        el.innerHTML = tiendas.map(([t,v],i) => `
            <div class="tienda-card ${colors[i]||'t3'}">
                <div class="tienda-name">${t}</div>
                <div class="tienda-aov">${fmt(v.total/v.count)}</div>
                <div class="tienda-orders">${v.count.toLocaleString('es-AR')} órdenes · ${fmtK(v.total)}</div>
            </div>
        `).join('');
    });
}

// ── TOP PRODUCTS (tabs de marca) ──────────────────────────────────────────
function renderTopProductsHTML(tab) {
    return `
        <div class="two-col">
            <div class="chart-card">
                <div class="card-header"><div class="card-title">Top SKUs por AOV</div></div>
                <div id="topAov-${tab}"></div>
            </div>
            <div class="chart-card">
                <div class="card-header"><div class="card-title">Top SKUs por volumen</div></div>
                <div id="topVol-${tab}"></div>
            </div>
        </div>
    `;
}
function renderTopProducts(tab, DATA) {
    const skuMap = {};
    DATA.forEach(o => {
        const s = o.sku || 'Sin SKU';
        if (!skuMap[s]) skuMap[s] = { total:0, count:0 };
        skuMap[s].total += o.total; skuMap[s].count++;
    });
    const entries = Object.entries(skuMap);

    const byAov = [...entries].filter(([,v])=>v.count>=2).sort((a,b) => (b[1].total/b[1].count) - (a[1].total/a[1].count)).slice(0,8);
    const byVol = [...entries].sort((a,b) => b[1].count - a[1].count).slice(0,8);

    const rowsHtml = (arr, valueKey) => arr.map(([sku,v],i) => `
        <div class="prod-row">
            <div class="prod-rank">${i+1}</div>
            <div class="prod-name" title="${sku}">${sku}</div>
            <div class="prod-aov">${valueKey==='aov' ? fmt(v.total/v.count) : v.count.toLocaleString('es-AR')}</div>
            <div class="prod-cnt">${valueKey==='aov' ? v.count+' ords' : fmtK(v.total)}</div>
        </div>
    `).join('');

    const aovEl = document.getElementById('topAov-'+tab);
    const volEl = document.getElementById('topVol-'+tab);
    if (aovEl) aovEl.innerHTML = byAov.length ? rowsHtml(byAov,'aov') : '<div class="empty" style="padding:20px;">Sin datos</div>';
    if (volEl) volEl.innerHTML = byVol.length ? rowsHtml(byVol,'vol') : '<div class="empty" style="padding:20px;">Sin datos</div>';
}

// ── UTILS ─────────────────────────────────────────────────────────────────
function calcMedian(arr) {
    const s = [...arr].sort((a,b)=>a-b);
    const m = Math.floor(s.length/2);
    return s.length%2!==0 ? s[m] : (s[m-1]+s[m])/2;
}

function toggleTheme() {
    document.body.classList.toggle('dark');
    document.getElementById('themeBtn').textContent = document.body.classList.contains('dark') ? 'Modo Claro' : 'Modo Noche';
    if (RAW_ORDERS.length) {
        ['general','hairfy','fyn'].forEach(tab => {
            const y = document.getElementById('yearFilter-'+tab)?.value || '';
            const m = document.getElementById('monthFilter-'+tab)?.value || '';
            render(tab, y, m);
        });
    }
}

loadData();
</script>
