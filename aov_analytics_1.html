<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYnutrition — AOV Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --green:#16a97e; --green-light:#e6f7f2; --green-dark:#0d7a5a;
            --blue:#2563eb; --blue-light:#eff6ff;
            --orange:#f59e0b; --orange-light:#fffbeb;
            --red:#ef4444; --red-light:#fef2f2;
            --purple:#8b5cf6; --purple-light:#f5f3ff;
            --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f9fafb;
            --border:#e5e7eb; --border-dark:#d1d5db;
            --text-1:#111827; --text-2:#374151; --text-3:#6b7280; --text-4:#9ca3af;
            --radius:12px; --radius-lg:16px;
        }
        body.dark {
            --bg:#0f1117; --surface:#1a1d27; --surface-2:#22263a;
            --border:#2d3148; --border-dark:#3a3f5c;
            --text-1:#f1f5f9; --text-2:#cbd5e1; --text-3:#94a3b8; --text-4:#64748b;
            --green-light:#0d3d2e; --blue-light:#1e2a4a; --orange-light:#3a2e10;
            --red-light:#3a1515; --purple-light:#2d1f4a;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text-1); min-height:100vh; transition:background .3s,color .3s; }

        /* TOPBAR */
        .topbar {
            background:var(--surface); border-bottom:1px solid var(--border);
            padding:0 28px; height:60px; display:flex; align-items:center;
            justify-content:space-between; position:sticky; top:0; z-index:100;
        }
        .topbar-left { display:flex; align-items:center; gap:12px; }
        .logo-dot { width:28px; height:28px; background:var(--green); border-radius:8px; display:grid; place-items:center; color:#fff; font-size:13px; }
        .topbar-title { font-size:15px; font-weight:600; color:var(--text-1); }
        .topbar-right { display:flex; align-items:center; gap:10px; }
        .btn-sync { display:flex; align-items:center; gap:7px; padding:8px 16px; background:var(--green); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; font-family:'DM Sans',sans-serif; cursor:pointer; transition:background .15s; }
        .btn-sync:hover { background:var(--green-dark); }
        .btn-sync.loading i { animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .status-dot { width:8px; height:8px; border-radius:50%; background:var(--text-4); transition:background .3s; }
        .status-dot.ok { background:var(--green); }
        .theme-btn { padding:7px 12px; border:1px solid var(--border-dark); border-radius:8px; background:none; color:var(--text-3); font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; }
        .theme-btn:hover { background:var(--surface-2); color:var(--text-1); }

        /* FILTERS */
        .filters-bar {
            background:var(--surface); border-bottom:1px solid var(--border);
            padding:12px 28px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
        }
        .filter-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-4); margin-right:4px; }
        .filter-btn {
            padding:5px 12px; border-radius:7px; border:1px solid var(--border);
            background:none; color:var(--text-3); font-family:'DM Sans',sans-serif;
            font-size:12px; font-weight:500; cursor:pointer; transition:all .15s;
        }
        .filter-btn:hover { border-color:var(--green); color:var(--green); }
        .filter-btn.active { background:var(--green-light); border-color:var(--green); color:var(--green-dark); font-weight:600; }
        body.dark .filter-btn.active { color:#34d399; }
        .filter-sep { width:1px; height:18px; background:var(--border); margin:0 4px; }

        /* CONTENT */
        .content { padding:28px; max-width:1400px; margin:0 auto; }

        /* KPI */
        .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:24px; }
        .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; display:flex; flex-direction:column; gap:6px; }
        .kpi-header { display:flex; justify-content:space-between; align-items:flex-start; }
        .kpi-label { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--text-3); }
        .kpi-icon { width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:13px; }
        .kpi-icon.green  { background:var(--green-light);  color:var(--green); }
        .kpi-icon.blue   { background:var(--blue-light);   color:var(--blue); }
        .kpi-icon.orange { background:var(--orange-light); color:var(--orange); }
        .kpi-icon.red    { background:var(--red-light);    color:var(--red); }
        .kpi-icon.purple { background:var(--purple-light); color:var(--purple); }
        .kpi-value { font-size:26px; font-weight:700; color:var(--text-1); letter-spacing:-.5px; line-height:1; margin-top:4px; }
        .kpi-sub { font-size:12px; color:var(--text-3); }

        /* CARDS */
        .charts-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        .chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; }
        .chart-card.full { grid-column:1/-1; }
        .card-title { font-size:14px; font-weight:600; color:var(--text-1); margin-bottom:3px; }
        .card-sub { font-size:12px; color:var(--text-3); margin-bottom:18px; }
        .chart-wrap { position:relative; height:240px; }
        .chart-wrap-lg { position:relative; height:280px; }

        /* TIENDA CARDS */
        .tienda-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
        .tienda-card { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; position:relative; overflow:hidden; }
        .tienda-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; }
        .tienda-card:nth-child(1)::before { background:var(--green); }
        .tienda-card:nth-child(2)::before { background:var(--blue); }
        .tienda-card:nth-child(3)::before { background:var(--orange); }
        .tienda-card:nth-child(4)::before { background:var(--purple); }
        .tienda-name { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.7px; color:var(--text-4); margin-bottom:6px; }
        .tienda-aov { font-size:22px; font-weight:700; color:var(--text-1); letter-spacing:-.3px; }
        .tienda-meta { font-size:11px; color:var(--text-3); margin-top:4px; }

        /* DISTRIBUTION */
        .dist-row { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); }
        .dist-row:last-child { border-bottom:none; }
        .dist-range { font-family:'DM Mono',monospace; font-size:12px; color:var(--text-2); width:140px; flex-shrink:0; }
        .dist-bar-wrap { flex:1; height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
        .dist-bar { height:100%; border-radius:3px; background:var(--green); transition:width .6s ease; }
        .dist-count { font-size:12px; color:var(--text-3); width:64px; text-align:right; flex-shrink:0; }
        .dist-pct { font-family:'DM Mono',monospace; font-size:12px; color:var(--green); width:44px; text-align:right; flex-shrink:0; }

        .empty { padding:48px; text-align:center; color:var(--text-4); font-size:13px; }
        .loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:999; place-items:center; }
        .loading-overlay.show { display:grid; }
        .loading-box { background:var(--surface); border-radius:14px; padding:28px 36px; display:flex; align-items:center; gap:14px; font-size:14px; font-weight:600; color:var(--text-1); }
        .spinner { width:20px; height:20px; border:2.5px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box"><div class="spinner"></div> Cargando datos…</div>
</div>

<header class="topbar">
    <div class="topbar-left">
        <div class="logo-dot"><i class="fas fa-bolt"></i></div>
        <span class="topbar-title">AOV Analytics</span>
    </div>
    <div class="topbar-right">
        <div class="status-dot" id="statusDot"></div>
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">Modo Noche</button>
        <button class="btn-sync" id="syncBtn" onclick="loadData()">
            <i class="fas fa-sync-alt"></i> Sincronizar
        </button>
    </div>
</header>

<div class="filters-bar">
    <span class="filter-label">Período</span>
    <button class="filter-btn active" data-period="all"  onclick="setPeriod(this)">Todo</button>
    <button class="filter-btn" data-period="365" onclick="setPeriod(this)">Último año</button>
    <button class="filter-btn" data-period="180" onclick="setPeriod(this)">6 meses</button>
    <button class="filter-btn" data-period="90"  onclick="setPeriod(this)">3 meses</button>
    <button class="filter-btn" data-period="30"  onclick="setPeriod(this)">30 días</button>
    <div class="filter-sep"></div>
    <span class="filter-label">Tienda</span>
    <button class="filter-btn active" data-tienda="" onclick="setTienda(this)">Todas</button>
    <div id="tiendaBtns" style="display:contents;"></div>
</div>

<div class="content" id="mainContent">
    <div class="empty">Hacé click en Sincronizar para cargar el análisis</div>
</div>

<script>
const SUPA_URL = 'https://tilsqawlwgbuttyboxpn.supabase.co';
const SUPA_KEY = 'sb_publishable_14OWO27CxU7Cml4rwtvBlg_8RR-6sGm';

let RAW = [];
let DATA = [];
let CHARTS = {};
let activePeriod = 'all';
let activeTienda = '';

function fmt(n) { return '$' + Math.round(n).toLocaleString('es-AR'); }
function fmtK(n) { return n >= 1000000 ? '$' + (n/1000000).toFixed(1) + 'M' : n >= 1000 ? '$' + (n/1000).toFixed(0) + 'k' : fmt(n); }

async function loadData() {
    const overlay   = document.getElementById('loadingOverlay');
    const syncBtn   = document.getElementById('syncBtn');
    const statusDot = document.getElementById('statusDot');
    overlay.classList.add('show');
    syncBtn.classList.add('loading');
    statusDot.classList.remove('ok');

    try {
        let all = [];
        let from = 0;
        const pageSize = 1000;
        while (true) {
            const res = await fetch(
                // Solo filas con total_ars > 0
                `${SUPA_URL}/rest/v1/ventas?select=num_venta,fecha,total_ars,tienda,dni&total_ars=gt.0&limit=${pageSize}&offset=${from}`,
                { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}` } }
            );
            if (!res.ok) throw new Error(`Error ${res.status}`);
            const page = await res.json();
            all = all.concat(page);
            if (page.length < pageSize) break;
            from += pageSize;
        }

        // Agrupar por num_venta → total por orden
        const ordenMap = {};
        all.forEach(r => {
            if (!r.num_venta) return;
            if (!ordenMap[r.num_venta]) {
                ordenMap[r.num_venta] = { total:0, fecha:r.fecha, tienda:r.tienda||'', dni:r.dni||'' };
            }
            ordenMap[r.num_venta].total += parseFloat(r.total_ars) || 0;
        });

        RAW = Object.values(ordenMap).filter(o => o.total > 0);

        // Filtros de tienda dinámicos
        const tiendas = [...new Set(RAW.map(o => o.tienda).filter(Boolean))].sort();
        document.getElementById('tiendaBtns').innerHTML = tiendas.map(t =>
            `<button class="filter-btn" data-tienda="${t}" onclick="setTienda(this)">${t}</button>`
        ).join('');

        statusDot.classList.add('ok');
        applyFilters();
    } catch(e) {
        console.error(e);
        alert('Error al conectar con Supabase: ' + e.message);
    } finally {
        overlay.classList.remove('show');
        syncBtn.classList.remove('loading');
    }
}

function setPeriod(el) {
    document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    activePeriod = el.dataset.period;
    applyFilters();
}

function setTienda(el) {
    document.querySelectorAll('[data-tienda]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    activeTienda = el.dataset.tienda;
    applyFilters();
}

function applyFilters() {
    let filtered = [...RAW];
    if (activePeriod !== 'all') {
        const cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - parseInt(activePeriod));
        filtered = filtered.filter(o => o.fecha && new Date(o.fecha) >= cutoff);
    }
    if (activeTienda) filtered = filtered.filter(o => o.tienda === activeTienda);
    DATA = filtered;
    render();
}

function render() {
    if (!DATA.length) {
        document.getElementById('mainContent').innerHTML = '<div class="empty">Sin datos para el período seleccionado</div>';
        return;
    }

    const totals  = DATA.map(o => o.total);
    const revenue = totals.reduce((s,v) => s+v, 0);
    const aov     = revenue / totals.length;
    const median  = calcMedian(totals);
    const maxOrd  = Math.max(...totals);
    const uniqueClients = new Set(DATA.map(o => o.dni).filter(Boolean)).size;

    document.getElementById('mainContent').innerHTML = `
        <div class="kpi-grid">
            <div class="kpi">
                <div class="kpi-header"><span class="kpi-label">AOV General</span><div class="kpi-icon green"><i class="fas fa-dollar-sign"></i></div></div>
                <div class="kpi-value">${fmt(aov)}</div>
                <div class="kpi-sub">Ticket promedio por orden</div>
            </div>
            <div class="kpi">
                <div class="kpi-header"><span class="kpi-label">Mediana</span><div class="kpi-icon blue"><i class="fas fa-chart-line"></i></div></div>
                <div class="kpi-value">${fmt(median)}</div>
                <div class="kpi-sub">50% de órdenes debajo</div>
            </div>
            <div class="kpi">
                <div class="kpi-header"><span class="kpi-label">Órdenes</span><div class="kpi-icon orange"><i class="fas fa-receipt"></i></div></div>
                <div class="kpi-value">${DATA.length.toLocaleString('es-AR')}</div>
                <div class="kpi-sub">Con total mayor a $0</div>
            </div>
            <div class="kpi">
                <div class="kpi-header"><span class="kpi-label">Orden máxima</span><div class="kpi-icon red"><i class="fas fa-arrow-up"></i></div></div>
                <div class="kpi-value">${fmt(maxOrd)}</div>
                <div class="kpi-sub">Mayor ticket individual</div>
            </div>
            <div class="kpi">
                <div class="kpi-header"><span class="kpi-label">Clientes únicos</span><div class="kpi-icon purple"><i class="fas fa-user"></i></div></div>
                <div class="kpi-value">${uniqueClients.toLocaleString('es-AR')}</div>
                <div class="kpi-sub">DNIs distintos</div>
            </div>
            <div class="kpi">
                <div class="kpi-header"><span class="kpi-label">Revenue total</span><div class="kpi-icon green"><i class="fas fa-coins"></i></div></div>
                <div class="kpi-value">${fmtK(revenue)}</div>
                <div class="kpi-sub">Suma de órdenes válidas</div>
            </div>
        </div>

        <div class="chart-card" style="margin-bottom:16px;">
            <div class="card-title">AOV por tienda</div>
            <div class="card-sub">Ticket promedio, órdenes y revenue por canal de venta</div>
            <div class="tienda-grid" id="tiendaCards"></div>
        </div>

        <div class="charts-grid">
            <div class="chart-card full">
                <div class="card-title">Evolución del AOV mensual</div>
                <div class="card-sub">Ticket promedio por mes en el período seleccionado</div>
                <div class="chart-wrap-lg"><canvas id="chartEvol"></canvas></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <div class="card-title">Distribución de tickets</div>
                <div class="card-sub">Concentración de órdenes por rango de precio</div>
                <div id="distRows"></div>
            </div>
            <div class="chart-card">
                <div class="card-title">Órdenes por rango de precio</div>
                <div class="card-sub">Cantidad de órdenes en cada bracket</div>
                <div class="chart-wrap"><canvas id="chartDist"></canvas></div>
            </div>
        </div>
    `;

    // AOV por tienda
    const tiendaMap = {};
    DATA.forEach(o => {
        const t = o.tienda || 'Sin tienda';
        if (!tiendaMap[t]) tiendaMap[t] = { total:0, count:0 };
        tiendaMap[t].total += o.total;
        tiendaMap[t].count++;
    });
    const tiendas = Object.entries(tiendaMap).sort((a,b) => b[1].total - a[1].total);
    document.getElementById('tiendaCards').innerHTML = tiendas.map(([t,v]) => `
        <div class="tienda-card">
            <div class="tienda-name">${t}</div>
            <div class="tienda-aov">${fmt(v.total/v.count)}</div>
            <div class="tienda-meta">${v.count.toLocaleString('es-AR')} órdenes · ${fmtK(v.total)}</div>
        </div>
    `).join('');

    // Evolución mensual
    const monthMap = {};
    DATA.forEach(o => {
        if (!o.fecha) return;
        const key = o.fecha.substring(0,7);
        if (!monthMap[key]) monthMap[key] = { total:0, count:0 };
        monthMap[key].total += o.total;
        monthMap[key].count++;
    });
    const months = Object.keys(monthMap).sort();
    const aovByMonth = months.map(m => monthMap[m].total / monthMap[m].count);
    const countByMonth = months.map(m => monthMap[m].count);

    Object.values(CHARTS).forEach(c => { try { c.destroy(); } catch(e){} });
    CHARTS = {};

    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#e5e7eb';
    const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-3').trim() || '#6b7280';

    CHARTS.evol = new Chart(document.getElementById('chartEvol'), {
        type: 'line',
        data: {
            labels: months.map(m => { const [y,mo] = m.split('-'); return `${mo}/${y.slice(2)}`; }),
            datasets: [
                {
                    label: 'AOV',
                    data: aovByMonth,
                    borderColor: '#16a97e',
                    backgroundColor: 'rgba(22,169,126,.08)',
                    borderWidth: 2.5,
                    pointRadius: 4,
                    pointBackgroundColor: '#16a97e',
                    fill: true,
                    tension: .3,
                    yAxisID: 'y',
                },
                {
                    label: 'Órdenes',
                    data: countByMonth,
                    borderColor: '#2563eb',
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 3,
                    pointBackgroundColor: '#2563eb',
                    borderDash: [4,3],
                    tension: .3,
                    yAxisID: 'y2',
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { position:'top', align:'end', labels: { font:{family:'DM Sans',size:11}, boxWidth:10, padding:16 } },
                tooltip: { callbacks: { label: ctx => ctx.datasetIndex === 0 ? ` AOV: ${fmt(ctx.raw)}` : ` Órdenes: ${ctx.raw}` } }
            },
            scales: {
                x: { grid:{color:'rgba(0,0,0,.05)'}, ticks:{color:textColor, font:{size:11}, maxTicksLimit:14} },
                y: { grid:{color:'rgba(0,0,0,.05)'}, ticks:{color:'#16a97e', font:{size:11}, callback: v => fmtK(v)}, position:'left' },
                y2: { grid:{display:false}, ticks:{color:'#2563eb', font:{size:11}}, position:'right' }
            }
        }
    });

    // Distribución
    const ranges = [
        { label:'$0 — $10k',     min:0,       max:10000 },
        { label:'$10k — $25k',   min:10000,   max:25000 },
        { label:'$25k — $50k',   min:25000,   max:50000 },
        { label:'$50k — $100k',  min:50000,   max:100000 },
        { label:'$100k — $200k', min:100000,  max:200000 },
        { label:'$200k+',        min:200000,  max:Infinity },
    ];
    const distCounts = ranges.map(r => DATA.filter(o => o.total >= r.min && o.total < r.max).length);
    const maxCount   = Math.max(...distCounts);
    const colors     = ['#16a97e','#2563eb','#f59e0b','#8b5cf6','#ef4444','#ec4899'];

    document.getElementById('distRows').innerHTML = ranges.map((r,i) => `
        <div class="dist-row">
            <div class="dist-range">${r.label}</div>
            <div class="dist-bar-wrap"><div class="dist-bar" style="width:${maxCount?(distCounts[i]/maxCount*100):0}%; background:${colors[i]};"></div></div>
            <div class="dist-count">${distCounts[i].toLocaleString('es-AR')}</div>
            <div class="dist-pct" style="color:${colors[i]}">${DATA.length?(distCounts[i]/DATA.length*100).toFixed(1):0}%</div>
        </div>
    `).join('');

    CHARTS.dist = new Chart(document.getElementById('chartDist'), {
        type:'bar',
        data: {
            labels: ranges.map(r => r.label),
            datasets:[{ data:distCounts, backgroundColor:colors, borderRadius:6, borderSkipped:false }]
        },
        options: {
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{display:false} },
            scales:{
                x:{ grid:{display:false}, ticks:{color:textColor, font:{size:10}, maxRotation:30} },
                y:{ grid:{color:'rgba(0,0,0,.05)'}, ticks:{color:textColor, font:{size:11}} }
            }
        }
    });
}

function calcMedian(arr) {
    const s = [...arr].sort((a,b) => a-b);
    const mid = Math.floor(s.length/2);
    return s.length%2 !== 0 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function toggleTheme() {
    document.body.classList.toggle('dark');
    const dark = document.body.classList.contains('dark');
    document.getElementById('themeBtn').textContent = dark ? 'Modo Claro' : 'Modo Noche';
    if (DATA.length) render();
}

loadData();
</script>
</body>
</html>
